<template>
    <div class="slds-m-top_medium"><b>{masterLabel}</b></div>
    <template for:each={listData} for:item="item">
        <c-dynamic-rows-child key={item.order} entity={item} onchangeinput={changeItem} onremoveitem={removeItem}
            builder-context={builderContext} automatic-output-variables={automaticOutputVariables}>
        </c-dynamic-rows-child>
    </template>
    <div class="slds-m-top_small">
        <lightning-button label="Adicionar linha" onclick={addItem}></lightning-button>
    </div>
</template>
