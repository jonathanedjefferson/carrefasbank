<template>

        <lightning-layout-item size="12" medium-device-size="4" padding="around-small">
            <div class="page-section page-header">
                <div class="slds-global-header slds-grid slds-grid_align-spread" style="height: 50px; background-color: #266200;">
                    <div class="slds-global-header__item">
                        <img src={salesimagem} alt="Salesforce Image" class="custom" title="Chat Atacadão" style="float:left; width: 65px; background-color: #266200;" />
                            <h2> Chat do Atacadão </h2>
                            <article class="slds-card" style="float:right; width: 65px; background-color: #266200;">
                                <div class="slds-m-left_x-large">
                                    <img src={fechar} onclick={close}/>
                                </div>
                            </article>
                            
                            <article class="slds-card" style="float:right; width: 15px; background-color: #266200; margin-top: 20px;">
                                <div class="slds-m-left_x-large">
                                    <img src={min} onclick={minimize} />
                                </div>
                            </article>
                    </div>
                </div>
                <!-- Display the idle timeout warning div -->
                <div class={chatLabelClass} if:true={showIdleTimeoutWarning}>
                    <span>{textLabel}</span>
                </div>
            </div>
        </lightning-layout-item>
    
</template>
