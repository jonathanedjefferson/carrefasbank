<template>
    
    <div if:true={spinner}>
        <lightning-spinner alternative-text="Loading" size="large" variant="brand"></lightning-spinner>
    </div>
    <div class="lwc-header">
        <div class="top-header">
            <div class="header-icon">
                <lightning-icon icon-name="standard:webcart" alternative-text="Ativos" title="Ativos"
                    class="slds-avatar_large"></lightning-icon>
            </div>
            <div class="header-name">
                <lightning-breadcrumbs>
                    <lightning-breadcrumb label="Conta Financeira" href="">
                    </lightning-breadcrumb>
                    <lightning-breadcrumb label={codContaFinanceira} href="">
                    </lightning-breadcrumb>
                </lightning-breadcrumbs>
                <label class="title">Autorização On-us e Off-us</label>
            </div>
            <div class="boxMenu">
                <lightning-combobox label="Selecione o cartão" options={cartaoOptions} onchange={handleCartao}
                    value={value} class="infoCartao slds-m-right_large">
                </lightning-combobox>
                <lightning-input type="date" date-style="short" name="input1" label="Período inicial" placeholder="Selecionar"
                    onchange={handleDataInicial} value={dataInicial}
                    class="date-format-hide infoCartao slds-m-right_medium"></lightning-input>
                <lightning-input type="date" date-style="short" name="input1" label="Período final" placeholder="Selecionar"
                    onchange={handleDataFinal} value={dataFinal} 
                    class="date-format-hide infoCartao slds-m-right_medium"></lightning-input>
                <lightning-button variant="brand" label="Buscar compras" onclick={handleBuscarCompras}
                    class="date-format-hide infoCartao slds-m-right_medium button"></lightning-button>
                <lightning-button-icon icon-name="utility:refresh" class="iconAtualizar date-format-hide button" title="Atualizar"></lightning-button-icon>
            </div>

        </div>

    <template if:true={retorno}>
        <div class="table-assets" style="">
            <lightning-datatable key-field="ativoId" data={formattedData} columns={columns} onrowaction={abrirModalCaso}
                hide-checkbox-column>
            </lightning-datatable>
        </div>
        <div class="lwc-footer">
            <div class = "cmpPagina" if:true={mostrarPaginacao}> 
                <div class="cmpPaginaCenter">
                    <lightning-button-icon icon-name="utility:chevronleft"  size="small"    alternative-text="View More" class="slds-m-left_xx-small" onclick={pagVoltar} disabled={disablePagVoltar}></lightning-button-icon>
                        <span class="cmpPaginaNumber">{pagina}</span>
                    <lightning-button-icon icon-name="utility:chevronright"  size="small"    alternative-text="View More" class="slds-m-left_xx-small" onclick={pagIr} disabled={disablePagIr}></lightning-button-icon>
                    <lightning-combobox 
                        class = "cmpPaginaQuant"
                        name="progress"
                        value={value}
                        placeholder="10"
                        options={quantidadePag}
                        onchange={handleChangePagina} >
                    </lightning-combobox>
                </div>
                <div class="cmpPaginaDireita">
                    Ver {pagina} - {totalPagina} de {totalItens}
                </div>
            </div>
        </div>
    </template>

        <template if:true={btnCaso}>
            <footer>
                <div class="boxFooter">
                    <ul class="slds-grid slds-grid_align-spread">
                        <li class="slds-col">
                            <lightning-button variant="brand" label="Criar Caso" onclick={abrirCasoSimples}></lightning-button>
                            <template if:true={abrirCaso}>
                                <!-- Modal/Popup Box LWC starts here -->
                                <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                                    class="slds-modal slds-fade-in-open  slds-modal_medium">
                                    <div id='abrirCaso' class="slds-modal__container">
                                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                            name="buttonAssets_contactless" onclick={fecharCasoSimples}>
                                            <lightning-icon icon-name="utility:close" size="small"> </lightning-icon>
                                            <span class="slds-assistive-text">Cancelar e fechar</span>
                                        </button>
                                        <div class="slds-modal__content" id="modal-content-id-2">
                                            <c-bcsf_-lista-transacoes-on-us-off-us-caso 
                                                record-id={recordId}
                                                numero-cartao-ofuscado={numeroCartaoOfuscado}
                                                nome-cartao={nomeCartao}
                                                status-cartao={statusCartao}
                                                transacao-duplicada={transacaoSelecionada.transacaoDuplicada}
                                                date-transacao={transacaoSelecionada.dateTransacao}
                                                estabelecimento={transacaoSelecionada.estabelecimento}
                                                valor={transacaoSelecionada.valor}
                                                codigo={transacaoSelecionada.codigo}
                                                status-transacao={transacaoSelecionada.statusTransacao}
                                                traducao-recusa={transacaoSelecionada.traducaoRecusa}
                                                codigo-recusa={transacaoSelecionada.codigoRecusa}
                                                ramo-atividade={transacaoSelecionada.ramoAtividade}
                                                cidade={transacaoSelecionada.cidade}
                                                pais={transacaoSelecionada.pais}
                                                quantidade-parcelas={transacaoSelecionada.quantidadeParcelas}
                                                tipo-transacao={transacaoSelecionada.tipoTransacao} 
                                                tipo-pagamento={transacaoSelecionada.tipoPagamento}
                                                limite-total={limiteTotal} 
                                                limite-disponivel={limiteDisponivel}
                                                step-one={stepOne}
                                                step-two={stepTwo} 
                                                step-three={stepThree}
                                                step-case-two={stepCaseTwo}
                                                codigo-entrada={transacaoSelecionada.codigoEntrada}
                                                detalhe-entrada={transacaoSelecionada.detalheEntrada}
                                                close-parent-component={closeModalComponent}
                                                meio-pagamento={transacaoSelecionada.meioPagamento}
                                                valor-parcelado={transacaoSelecionada.valorParcelado}
                                                titular-apresentar={titularApresentar}
                                                oncloseparentmodal={closeQuickAction}></c-bcsf_-lista-transacoes-on-us-off-us-caso>
                                        </div>
                                    </div>
                                </section>
                                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
                            </template>
                        </li>
                    </ul>
                </div>
            </footer>
        </template>
    
        
    
</template>
