<template>
    <template if:true={isCashbackReceived}>
        <div class="external-container">
            <h1 class="detail-title">Dados da Transação:</h1>
            <lightning-layout multiple-rows="true">
                <lightning-layout-item size="4">Tipo da Transação</lightning-layout-item>
                <lightning-layout-item size="8" class="detail-value">Cashback Recebido</lightning-layout-item>
                <lightning-layout-item size="4">Cashback Recebido</lightning-layout-item>
                <lightning-layout-item size="8" class="detail-value">{detail.rewardAmount}</lightning-layout-item>
                <lightning-layout-item size="4">Data do Recebimento</lightning-layout-item>
                <lightning-layout-item size="8" class="detail-value">{detail.transactionDate}</lightning-layout-item>
            </lightning-layout>
        </div>
        <div class="external-container">
            <h1 class="detail-title">Dados da Compra:</h1>
            <lightning-layout multiple-rows="true">
                <lightning-layout-item size="4">Loja</lightning-layout-item>
                <lightning-layout-item size="8" class="detail-value">{detail.originDescription}</lightning-layout-item>
                <lightning-layout-item size="4">Valor da Compra</lightning-layout-item>
                <lightning-layout-item size="8" class="detail-value">{detail.purchaseAmount}</lightning-layout-item>
                <lightning-layout-item size="4">Data da Compra</lightning-layout-item>
                <lightning-layout-item size="8" class="detail-value">{detail.purchaseDateTime}</lightning-layout-item>
            </lightning-layout>
        </div>
        <div class="external-container">
            <lightning-button label="Detalhes da Compra" title="Detalhes da Compra" onclick={handlePurchaseDetails}></lightning-button>
            <lightning-button class="refund-button" label="Ajuste de cashback" title="Ajuste de cashback" onclick={handleRefund}></lightning-button>
        </div>
    </template>
    <template if:false={isCashbackReceived}>
        <div class="external-container">
            <h1 class="detail-title">Dados da Transação:</h1>
            <lightning-layout multiple-rows="true">
                <template for:each={customCard} for:item="customField">
                    <lightning-layout-item size="4" key={customField.field}>{customField.label}</lightning-layout-item>
                    <lightning-layout-item size="8" class="detail-value" key={customField.field}>{customField.value}</lightning-layout-item>
                </template>
            </lightning-layout>
        </div>
        <div class="external-container" if:true={isRedeem}>
            <lightning-button class="reversal-button" label="Contestar resgate" title="Contestar resgate" onclick={handleReversal}></lightning-button>
        </div>
    </template>
    <template if:false={isCashbackRefunded}>
        <div class="external-container">
            <h1 class="detail-title">Dados da Transação:</h1>
            <lightning-layout multiple-rows="true">
                <lightning-layout-item size="4">Tipo da Transação</lightning-layout-item>
                <lightning-layout-item size="8" class="detail-value">Cashback Estornado</lightning-layout-item>
                <lightning-layout-item size="4">Cashback Estornado</lightning-layout-item>
                <lightning-layout-item size="8" class="detail-value">{detail.rewardAmount}</lightning-layout-item>
                <lightning-layout-item size="4">Data da Execução</lightning-layout-item>
                <lightning-layout-item size="8" class="detail-value">{detail.transactionDate}</lightning-layout-item>
                <lightning-layout-item size="4">Loja</lightning-layout-item>
                <lightning-layout-item size="8" class="detail-value">{detail.originDescription}</lightning-layout-item>
            </lightning-layout>
        </div>
    </template>
    <div class="detail-message" if:true={showMessage}>
        <lightning-icon icon-name="utility:info" alternative-text="Info" title="Info" size="small" class="icon"></lightning-icon>
        {message}
    </div>
</template>
