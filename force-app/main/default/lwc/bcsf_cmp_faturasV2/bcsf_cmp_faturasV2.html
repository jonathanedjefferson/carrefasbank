<template>
    <template if:false={loaded}>
        <lightning-spinner class="spins"> </lightning-spinner>
    </template>
    
    <template if:true={modalSegundaVia}>
        <!-- Modal/Popup Box LWC starts here -->
    
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open  slds-modal_small">
            <div id='MyModal' class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={fecharModal}>
                    <!-- Ícone inline com classe de cor branca -->
                    <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                        <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
                        <path class="slds-icon-text-white" fill="white" d="M17 6.4L15.6 5 12 8.6 8.4 5 7 6.4 10.6 10l-3.6 3.6L7 15.6 8.4 17l3.6-3.6 3.6 3.6 1.4-1.4L13.4 10 17 6.4z"></path>
                    </svg>
                    <span class="slds-assistive-text">Cancelar e fechar</span>
                </button>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <c-bcsf_-segunda-via-fatura record-id={recordId} oncloseparentmodal={closeQuickAction}></c-bcsf_-segunda-via-fatura>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template if:true={modalBoletoAvulso}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-02" class="slds-modal slds-fade-in-open  slds-modal_small">
            <div id='myModalBeletoAvulso' class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={fecharModalBoletoAvulso}>
                    <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                        <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
                        <path class="slds-icon-text-white" fill="white" d="M17 6.4L15.6 5 12 8.6 8.4 5 7 6.4 10.6 10l-3.6 3.6L7 15.6 8.4 17l3.6-3.6 3.6 3.6 1.4-1.4L13.4 10 17 6.4z"></path>
                    </svg>
                    <span class="slds-assistive-text">Cancelar e fechar</span>
                </button>
                <div class="slds-modal__content slds-p-around_medium modalboleto" id="modal-content-id-2">
                    <c-bcsf_-boleto-avulso record-id={recordId} oncloseparentmodal={closeQuickAction}></c-bcsf_-boleto-avulso>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>  

    <template if:true={modalSaldoVencido}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-03" class="slds-modal slds-fade-in-open  slds-modal_small">
            <div id='myModalSaldoVencido' class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseModalSaldoVencido}>
                    <lightning-icon icon-name="utility:close" size="x-small" alternative-text="Close" title="Close"></lightning-icon>
                    <span class="slds-assistive-text">Cancelar e fechar</span>
                </button>
                <div class="slds-modal__header">
                    <h1 id="modal-heading-03" class="slds-modal__title slds-hyphenate" tabindex="-1">Saldo vencido atualizado</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-3">
                    <ul class="aling-items-start">
                        <li>
                            <p class="infoNameSaldo">Titular da conta</p>
                            <p class="infoValueSaldo">{nomeTitular}</p>
                        </li>
                        <li class="tipoConta">
                            <div class= "logo"><img src={logoTipo}></div>
                            <div>
                                <div class="infoNameSaldo">Tipo de conta</div>
                                <div class="infoValueSaldo">{tipoConta}</div>
                            </div>
                        </li>
                    </ul>
                    <div class="container-resumo-saldo-vencido">
                        <h2>Resumo do saldo</h2>
                        <p>Saldo Remanescente: <span>{saldoRemanescente}</span></p>
                        <p><span>(+)</span> Encargo de atraso: <span>{saldoEncargosAtraso}</span></p>
                        <p><span>(+)</span> Multa: <span>{saldoMulta}</span></p>
                        <p><span>(+)</span> Mora: <span>{saldoMora}</span></p>
                        <p class="descricao-saldo-vencido">
                            Esse saldo refere-se ao total da fatura acrescido de encargos de atraso, 
                            multa e mora calculados até a data desta simulação.<br>
                            Caso o cliente não realize o pagamento total do saldo 
                            vencido atualizado, o valor dos encargos de atraso, multa 
                            e mora, serão refinanciados até a próxima fatura.
                        </p>
                        <h3>Valor total = {saldoVencidoAtualizado}</h3>
                    </div>
                </div>
                <div class="slds-modal__footer slds-modal__footer_directional">
                    <lightning-button class="slds-button" variant="neutral" label="Fechar" title="Fechar" onclick={handleCloseModalSaldoVencido}></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template if:true={loaded}>

        <template if:true={faturaAbertaTable}>
            <h1 class="slds-text-heading_medium slds-text-weight_bold slds-m-bottom_x-small spacingContainerTop">Limites</h1>
            <div class="containerLimites spacingContainer">
                <div>
                    <p class="infoName">Total do Cartão</p>
                    <p class="infoValue">{limiteTotalCartao}</p>
                    <p lwc:if={showUltimaAlteracaoLimite} class="infoDescription">Última alteração {ultimaAlteracaoLimite}</p>
                </div>
                <div>
                    <p class="infoName">Disponível para Compras</p>
                    <p class="infoValue">{limiteTotalCompras}</p>
                </div>
                <div>
                    <p class="infoName">
                        Limite Autorização 
                        <lightning-helptext content="Percentual de limite para autorização emergencial"></lightning-helptext>
                    </p>
                    <p class="infoValue">{limiteAutorizadoEmergencial}%</p>
                </div>
                <div>
                    <p class="infoName">Limite Total de Saque</p>
                    <p class="infoValue">{limiteTotalSaque}</p>
                </div>
                <div>
                    <p class="infoName">Limite Disponível de Saque</p>
                    <p class="infoValue">{limiteDisponívelSaque}</p>
                </div>
            </div>

            <lightning-accordion allow-multiple-sections-open class="accordion-info-adicionais spacingContainer">
                <lightning-accordion-section name="informações_adicionais" label="Informações adicionais">
                    <div class="containe-info-adicionais">
                        <div>
                            <p class="infoName">Débito total</p>
                            <p class="infoValue">{debitoTotal}</p>
                        </div>
                        <div>
                            <p class="infoName">Forma de pagamento</p>
                            <p class="infoValue">{formaPagamento}</p>
                        </div>
                    </div>
                </lightning-accordion-section>
            </lightning-accordion>

            <lightning-accordion allow-multiple-sections-open class="accordion-info-adicionais spacingContainer">
                <lightning-accordion-section name="Cobrança" label="Em Cobrança">
                    <div class="containe-info-adicionais">
                        <div>
                            <p class="infoName">Débito pendente</p>
                            <p class="infoValue">{debitoPendente}</p>
                        </div>
                        <div>
                            <p class="infoName">Data enquadramento</p>
                            <p class="infoValue">{dataEnquadramento}</p>
                        </div>
                    </div>
                </lightning-accordion-section>
            </lightning-accordion>
            
            <div class="slds-m-vertical_small slds-p-left_medium slds-p-vertical_medium" style="border:0.5px #E8E8E8 solid; border-spacing: 5px;border-radius: 5px;border-collapse: separate;">
                <h2 class="slds-m-bottom_small slds-text-heading_small">Principais Atalhos</h2>
                <lightning-button-group>
                    <lightning-button style="height:32px;" label="Avaliação Emergencial de crédito" onclick={avaliacaoEmergencialHandler}></lightning-button>
                    <lightning-button style="height:32px;" label="Consultar histórico" onclick={consultaHistoricoLimiteHandler}></lightning-button>
                    <lightning-button style="height:32px;" label="Aumentar limite" onclick={aumentoLimiteHandler}></lightning-button>
                    <lightning-button style="height:32px;" label="Reduzir limite" onclick={reducaoLimiteHandler}></lightning-button>
                </lightning-button-group>
            </div>

            <div class="spacingContainer">
                <h1 class="slds-text-heading_medium slds-text-weight_bold">Faturas</h1>
                <div class="slds-m-vertical_small slds-p-left_medium slds-p-vertical_medium" style="border:0.5px #E8E8E8 solid; border-spacing: 5px;border-radius: 5px;border-collapse: separate;">
                    <h2 class="slds-m-bottom_small slds-text-heading_small">Principais atalhos</h2>
                    <lightning-button-group>
                        <lightning-button label="2ª via da fatura" onclick={segundaViaFaturaHandler}></lightning-button>
                        <lightning-button label="Autorização On-us e Off-us" onclick={AutorizacaoHandler}></lightning-button>
                        <lightning-button label="Pagamento antecipado" onclick={boletoAvulsoHandler}></lightning-button>
                        <lightning-button if:true={isLigadoButtonContestacao} label="Contestação de compras" onclick={contestacaoComprasHandler}></lightning-button>
                        <lightning-button if:true={isLigadoButtonAntecipacao} label="Parcelados" onclick={antecipacaoParcelasHandler}></lightning-button>
                        <lightning-button-menu alternative-text="Mais opções" disabled="true">
                            <lightning-menu-item label="Menu Item One" value="item1"></lightning-menu-item>
                        </lightning-button-menu>
                    </lightning-button-group>
                </div>
            </div>
            <div class="spacingContainer">
                <h1 class="subTitleAlternative">Última fatura fechada</h1>
                <div class="slds-m-vertical_small slds-p-left_medium slds-p-vertical_medium" style="border:0.5px #E8E8E8 solid; border-spacing: 5px;border-radius: 5px;border-collapse: separate;">
                    <div class="container-info-fatura-fechada spacingContainer">
                        <div>
                            <p class="infoName">Saldo Remanescente</p>
                            <p class="infoValue">{saldoRemanescente} (DÉBITO)</p>
                        </div>
                        <div>
                            <p class="infoName">Saldo Vencido Atualizado</p>
                            <p lwc:if={showBtnResumoSaldoVencido} class="infoValue">{saldoVencidoAtualizado} (DÉBITO)</p>
                            <p lwc:else class="infoValue">Sem saldo vencido</p>
                            <a lwc:if={showBtnResumoSaldoVencido} class="infoDescription" onclick={handleOpenModalSaldoVencido}>Conferir cálculo detalhado</a>
                        </div>
                        <div>
                            <p class="infoName">Data Último Pagamento</p>
                            <p class="infoValue">{dataUltimoPagamento}</p>
                        </div>
                        <div lwc:if={showDataReeimpressaoFatura} >
                            <p class="infoName">Data Reimpressão Fatura</p>
                            <p class="infoValue">{dataReimpressaoFatura}</p>
                        </div>
                    </div>
                    <h2 class="slds-m-bottom_xx-small slds-text-heading_small">Códigos de Pagamento</h2>
                    <h3 class="slds-m-bottom_xx-small">Código de Barras</h3>
                    <h3>{codigoBarras}</h3>
                    <lightning-button 
                        variant="base" 
                        label="Copiar" 
                        title="Copiar" 
                        onclick={copyText} 
                        data-text={codigoBarras}>
                    </lightning-button>
                </div>
            </div>
        </template>

        <lightning-accordion allow-multiple-sections-open active-section-name={section}
            onsectiontoggle={handleSectionToggle}>

            <!--RESUMO-->
            <template if:false={bloq_limparTudo}>
                <lightning-accordion-section name="resumo_faturas" label="Resumo de Lançamentos Selecionados"
                    class="resumo-faturas">
                    <div slot="actions">
                        <lightning-button style="margin-right: 1px;" variant="neutral" label="Limpar tudo"
                            class="slds-theme_brand" disabled={bloq_limparTudo} onclick={limparTodasAsFaturas}>
                        </lightning-button>
                        <lightning-button style="margin-left: 1px;" variant="brand" label="Estornar"
                            class="slds-theme_brand" disabled={bloq_limparTudo} onclick={showDecision}>
                        </lightning-button>

                        <c-bcsf_cmp_modal-estorno-fatura cpf={cpfCliente} open={showEstornoModal}
                            onnovocaso={handleCriarNovo} onvinculo={handleVincular} onclose={handleCloseEstornoModal}>
                        </c-bcsf_cmp_modal-estorno-fatura>
                    </div>

                    <div
                        style="margin-top:5px; border:0.5px #E8E8E8 solid; border-spacing: 5px;border-radius: 5px;border-collapse: separate;">
                        <lightning-datatable onrowselection={onSelectFaturaResumo} selected-rows={setSelectedRows}
                            data={faturasSelecionadas} columns={columns} key-field="idTransacao"></lightning-datatable>
                    </div>
                </lightning-accordion-section>
            </template>

            <!--FATURA ABERTA-->

            <template if:true={faturaAberta}>
                <c-bcsf_cmp_detalhes_fatura-v-2 fatura={faturaAberta} columns={columns} cliente_infos={cliente_infos}
                    is_fatura_aberta="true"></c-bcsf_cmp_detalhes_fatura-v-2>
            </template>

            <!--FATURAS FECHADAS-->
            <template for:each={fatFechadasArr} for:item="fatFechada" for:index="index">
                <div key={fatFechada.dados.dataVencimento}>
                    <c-bcsf_cmp_detalhes_fatura-v-2 fatura={fatFechada} columns={columns} cliente_infos={cliente_infos}>
                    </c-bcsf_cmp_detalhes_fatura-v-2>
                </div>
            </template>
        </lightning-accordion>


    </template>
</template>
