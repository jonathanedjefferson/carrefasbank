<template>
    <lightning-card title="Novo Lead" icon-name="standard:lead">
        <div class="slds-p-around_medium">
            <lightning-input 
                label="Nome" 
                value={name} 
                onchange={handleChange} 
                data-field="Name">
            </lightning-input>

            <lightning-input 
                type="tel" 
                label="Telefone" 
                value={phone} 
                onchange={handleChange} 
                data-field="Phone">
            </lightning-input>

            <lightning-combobox
                name="status"
                label="Lead Status"
                value={status}
                placeholder="Selecione um status"
                options={statusOptions}
                onchange={handleChange}
                data-field="Status">
            </lightning-combobox>

            <div class="slds-m-top_medium">
                <lightning-button variant="brand" label="Salvar" onclick={handleSave}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
