<!-- sldsValidatorIgnore -->
<template>
    <template if:true={firstStep}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleClose}>
                    <lightning-icon 
                        icon-name="utility:close" 
                        alternative-text="close" 
                        variant="inverse" size="small">
                    </lightning-icon>
                    <span class="slds-assistive-text">Cancel and close</span>
                </button>

                <div class="slds-modal__header">
                    <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Encargos, Tarifas e Anuidade</h1>
                </div>

                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <p>Deseja criar um novo caso de Encargos, Tarifas e Anuidade ou
                        vincular os estornos selecionados a um caso já existente?</p>
                    <br/>
                    <lightning-record-edit-form object-api-name="Case" density="compact">
                        <lightning-messages></lightning-messages>
                        <lightning-input-field field-name="Origin" onchange={handleOriginChange} required>
                        </lightning-input-field>
                        <lightning-input-field field-name="CanalEntrada__c" onchange={handleCanalChange} required>
                        </lightning-input-field>
                        <template if:true={userOuvidoria}>
                            <lightning-input-field field-name="DataRegulatoria__c" onchange={handleDataChange} required={dataRegulatoriaObrigatoria}>
                        </lightning-input-field>
                        </template>
                        <lightning-input-field field-name="Description" onchange={handleDescricaoChange} required>
                        </lightning-input-field>
                    </lightning-record-edit-form>
                </div>
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" disabled={linkButtonDisabled}
                        onclick={goToSecondStep}>Vincular Caso do Chat</button>
                    <button class="slds-button slds-button_brand" aria-label="Não" disabled={linkButtonDisabled}
                        onclick={handleNewCaso}>Criar</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
    <template if:true={secondStep}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-21"
            class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small">
                    </lightning-icon>
                    <span class="slds-assistive-text">Cancel and close</span>
                </button>
                <div class="slds-modal__header">
                    <h1 id="modal-heading-02" class="slds-modal__title slds-hyphenate">Selecionar Caso Existente</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <div class="slds-p-bottom_large slds-p-left_large" style="width:600px">
                        <div class="slds-combobox_container">
                            <div class={boxClass} aria-expanded="true" aria-haspopup="listbox" role="combobox">
                                <div class="slds-combobox__form-element" role="none">
                                    <template if:true={isValueSelected}>
                                        <div class="slds-pill-container">
                                            <lightning-pill class="pillSize" label={selectedFieldCaseNumber}
                                                onremove={handleRemovePill}>
                                            </lightning-pill>
                                        </div>
                                    </template>
                                    <template if:false={isValueSelected}>
                                        <br />
                                        <lightning-input class={inputClass} type="search" label="Número do Caso"
                                            placeholder={searchPlaceholder} value={searchTerm} onclick={handleClick}
                                            onchange={onChange} autocomplete="false">
                                        </lightning-input>
                                    </template>
                                </div>
                                <div class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid"
                                    role="listbox">
                                    <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                        <template for:each={listOfFields} for:item="rec">
                                            <li key={rec} data-id={rec.Id} data-name={rec.Id} data-item={rec.Id}
                                                data-casenumber={rec.CaseNumber} onclick={onSelect} role="presentation">
                                                <span class="slds-lookup__item-action" role="option">
                                                    <span class="slds-truncate">Caso: {rec.CaseNumber} -
                                                        {rec.Assunto__c}</span>
                                                </span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={goBack}>Voltar</button>
                    <button class="slds-button slds-button_brand" onclick={handleVincular}
                        disabled={disableVinculo}>Confirmar vinculo</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

</template>
